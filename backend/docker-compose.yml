services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Runs the Django dev server on all network interfaces inside the container
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1    # Forces real-time console log printing
      - PYTHONDONTWRITEBYTECODE=1 # Prevents cluttering code with .pyc files
    depends_on:
      - redis
    volumes:
      # 1. Mounts your project folder to get live code hot-reloading
      - .:/app
      # 2. Creates a dedicated named volume for SQLite so it never locks up
      - sqlite_data:/app/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  sqlite_data:
  redis_data:
