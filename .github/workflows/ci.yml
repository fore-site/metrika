name: Django CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: metrika
          POSTGRES_PASSWORD: metrika_pass
          POSTGRES_DB: metrika_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://metrika:metrika_pass@localhost:5432/metrika_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-for-tests-only
      DJANGO_SETTINGS_MODULE: config.ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate

      - name: Check for missing migrations
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: |
          cd backend
          python manage.py test

  deploy:
    needs: test # this job will only run if 'test' succeeds
    if: success() # also ensures it only runs on success (redundant but safe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (all services)
        run: |
          railway up --service=metrika --service=kind-love
          railway environment deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
